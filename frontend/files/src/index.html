<div class="auth-main">

      <div class="auth-header">
        <!--<a href="#"><img src="../assets/images/logo-dark.svg" alt="img"></a>-->
      </div>
      <div class="card my-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Đăng nhập</b></h3>
            <a href="/pages/register.html" class="link-primary">Bạn chưa có tài khoản?</a>
          </div>
          <form id="loginForm">
            <div class="form-group mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>
            <div class="form-group mb-3">
              <label class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" name="password" placeholder="Mật khẩu" required>
            </div>

            <div class="d-flex mt-1 justify-content-between">
              <div class="form-check">
                <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked>
                <label class="form-check-label text-muted" for="customCheckc1">Lưu tài khoản</label>
              </div>
              <h5 class="text-secondary f-w-400">Quên mật khẩu?</h5>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
          </form>
          <div class="row">
            <div class="col-4">
              <div class="d-grid">
                <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted" onclick="window.location.href='https://api.aagents.vn/api/v1/auth/google/callback'">
                  <img src="../assets/images/authentication/google.svg" alt="img"> <span class="d-none d-sm-inline-block"> Google</span>
                </button>
              </div>
            </div>
            <div class="col-4">
              <div class="d-grid">
                <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
                  <img src="../assets/images/authentication/twitter.svg" alt="img"> <span class="d-none d-sm-inline-block"> Twitter</span>
                </button>
              </div>
            </div>
            <div class="col-4">
              <div class="d-grid">
                <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
                  <img src="../assets/images/authentication/facebook.svg" alt="img"> <span class="d-none d-sm-inline-block"> Facebook</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="auth-footer row">
        <!-- <div class=""> -->

<script>
  redirectIfAuthenticated();
</script>
<script src="../assets/js/plugins/popper.min.js"></script>
<script src="../assets/js/plugins/simplebar.min.js"></script>
<script src="../assets/js/plugins/bootstrap.min.js"></script>
<script src="../assets/js/fonts/custom-font.js"></script>

<script>layout_change('light');</script>




<script>change_box_container('false');</script>



<script>layout_rtl_change('false');</script>


<script>preset_change("preset-1");</script>


<script>font_change("Public-Sans");</script>


<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const form = e.target;
    const data = {
      email: form.email.value,
      password: form.password.value
    };

    try {
      const res = await fetch('https://api.aagents.vn/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const json = await res.json();

      if (res.ok && json.access_token) {
        localStorage.setItem('access_token', json.access_token);
        alert('Đăng nhập thành công!');
        window.location.href = '/dashboard/index.html'; // Chuyển sang trang chính nếu muốn
      } else {
        alert(json.message || 'Đăng nhập thất bại');
      }
    } catch (err) {
      console.error(err);
      alert('Lỗi kết nối đến server');
    }
  });
</script>

</body>
