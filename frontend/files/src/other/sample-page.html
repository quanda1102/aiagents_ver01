<script>
    const token = localStorage.getItem('access_token');
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    };

    // 1. Load danh sách người dùng
    async function loadUsers() {
      try {
        const res = await fetch('https://api.aagents.vn/api/v1/users/', {
            method: 'GET',
            headers
         });
        const data = await res.json();

        const tableBody = document.getElementById('userTableBody');
        tableBody.innerHTML = '';

        data.forEach((user, i) => {
          tableBody.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td>${user.email}</td>
              <td>${user.full_name}</td>
              <td>${user.age}</td>
              <td>${user.gender}</td>
              <td>${user.class_name || '-'}</td>
              <td>${user.role}</td>
            </tr>`;
        });
      } catch (err) {
        alert('Lỗi khi tải danh sách người dùng.');
        console.error(err);
      }
    }

    // 2. Xử lý tạo người dùng mới
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('https://api.aagents.vn/api/v1/users', {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json && json.id) {
          alert('Tạo người dùng thành công!');
          form.reset();
          document.querySelector('#createUserModal .btn-close').click();
          loadUsers();
        } else {
          alert('Tạo thất bại!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi tạo người dùng.');
      }
    });

    // 3. Hàm tạo mật khẩu ngẫu nhiên
    function generatePassword() {
      const random = Math.random().toString(36).slice(-10) + Math.floor(Math.random() * 100);
      document.getElementById('passwordInput').value = random;
    }
    // 4. Kiểm tra login
    if (token) {
      loadUsers();
    }
    function copyPassword() {
      const password = document.getElementById('passwordInput').value;
      if (!password) {
        alert('Chưa có mật khẩu để sao chép!');
        return;
      }
    
      navigator.clipboard.writeText(password)
        .then(() => alert('Đã sao chép mật khẩu!'))
        .catch(err => alert('Không thể sao chép: ' + err));
    }
  </script>
