<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('access_token');
      const quizListContainer = document.getElementById('quizList');

      try {
        const apiUrl = getApiUrl('QUIZ') + '/list';
        const response = await fetch(apiUrl, {
              headers: {
                'Authorization': `Bearer ${token}`
              }
            });
        const json = await response.json();
        const quizzes = json.quizzes;

        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          quizListContainer.innerHTML = `
            <div class="col-12">
              <div class="text-center py-5">
                <i class="ti ti-clipboard-list" style="font-size: 4rem; color: #ccc;"></i>
                <h6 class="mt-3 text-muted">Chưa có bài tập nào</h6>
                <p class="text-muted">Tạo bài tập đầu tiên của bạn</p>
                <a href="../../pages/exercises/create-quizz.html" class="btn btn-primary">
                  <i class="ti ti-plus me-1"></i>Tạo bài tập
                </a>
              </div>
            </div>
          `;
          return;
        }

        quizzes.forEach((quiz) => {
          const card = document.createElement('div');
          card.className = 'col-md-6 col-lg-4';

          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${quiz.title}</h5>
                <p class="card-text text-muted">${quiz.description}</p>
                <div class="row text-center mb-3">
                  <div class="col-6">
                    <div class="d-flex flex-column">
                      <span class="h6 mb-0">${quiz.question_count}</span>
                      <small class="text-muted">Câu hỏi</small>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="d-flex flex-column">
                      <span class="h6 mb-0">${quiz.total_points}</span>
                      <small class="text-muted">Điểm</small>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <small class="text-muted">
                    <i class="ti ti-user me-1"></i>${quiz.created_by} •
                    <i class="ti ti-clock me-1"></i>${quiz.time_limit}s
                  </small>
                </div>
                <div class="d-flex gap-2">
                  <a href="/pages/exercises/attempt-quizz.html?id=${quiz.quiz_id}" class="btn btn-primary btn-sm flex-fill">
                    <i class="ti ti-play me-1"></i>Làm bài
                  </a>
                  <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteQuiz('${quiz.quiz_id}', this)" title="Xóa bài tập">
                    <i class="ti ti-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          quizListContainer.appendChild(card);
        });
      } catch (error) {
        console.error('Lỗi tải danh sách:', error);
        quizListContainer.innerHTML = `
