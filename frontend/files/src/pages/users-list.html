<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const ok = await checkRole(['ADMIN']);
        if (!ok) return;

        // Apply role-based visibility
        if (typeof applyRoleBasedVisibility === 'function') {
            await applyRoleBasedVisibility();

</script>
<script type="module">
    const token = localStorage.getItem('access_token');
    const headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
    };

    // ===== 1. Load danh sách lớp học =====
    async function loadClassOptions() {
        try {
            const res = await fetch('https://aimarketingvn.com/webhook/list-class');
            const data = await res.json();
            const classSelect = document.getElementById('classSelect');
            classSelect.innerHTML = '';

            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.mon;
                option.textContent = item.mon;
                classSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Lỗi tải danh sách lớp:', error);
        }
    }

    // ===== 2. Load danh sách người dùng =====
    // ===== 2. Load danh sách người dùng =====
    async function loadUsers() {
        try {
            const apiUrl = getApiUrl('USERS') + '/';
            const res = await fetch(apiUrl, {method: 'GET', headers});

            if (res.status === 403) {
                Swal.fire('Không có quyền!', 'Bạn không có quyền xem danh sách người dùng.', 'warning');
                return;
            }

            if (res.status === 401) {
                Swal.fire('Phiên đăng nhập hết hạn!', 'Vui lòng đăng nhập lại.', 'warning');
                localStorage.removeItem('access_token');
                window.location.href = '../pages/login.html';
                return;
            }

            if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                const errorMessage = errorData.detail || errorData.response || `HTTP ${res.status}: ${res.statusText}`;
                Swal.fire('Lỗi!', `Không thể tải danh sách: ${errorMessage}`, 'error');
                return;
            }

            const data = await res.json();
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" class="text-center">Không có người dùng nào.</td></tr>';
                return;
            }

            // Bắt đầu phần chỉnh sửa
            data.forEach((user, i) => {
                // Chuyển đổi giới tính sang tiếng Việt
                const genderInVietnamese = user.gender === 'male' ? 'Nam' : 'Nữ';

                // Chuyển đổi vai trò sang tiếng Việt
                const roleMap = {
                    'STUDENT': 'Học sinh',
                    'TEACHER': 'Giáo viên',
                    'ADMIN': 'Quản trị'
                };
                const roleInVietnamese = roleMap[user.role] || user.role; // Giữ nguyên nếu không có trong map

                const displayClassName = Array.isArray(user.class_name)
                    ? user.class_name.join(', ')
                    : (user.class_name || '-');

                tableBody.innerHTML += `
                  <tr data-id="${user.id}">
                    <td>${i + 1}</td>
                    <td>${user.email}</td>
                    <td class="editable" data-field="full_name">${user.full_name}</td>
                    <td class="editable" data-field="age">${user.age}</td>
                    <td class="editable" data-field="gender">${genderInVietnamese}</td>
                    <td class="editable" data-field="class_name" data-value='${JSON.stringify(user.class_name)}'>${(user.class_name || []).join(', ')}</td>
                    <td class="editable" data-field="role">${roleInVietnamese}</td>

                    <td class="action-buttons">
                      <button class="btn btn-sm btn-primary editBtn">Chỉnh sửa</button>
                      <button class="btn btn-sm btn-danger deleteBtn">Xoá</button>
                    </td>
                  </tr>`;
            });
            // Kết thúc phần chỉnh sửa

        } catch (err) {
            console.error('Load users error:', err);
            Swal.fire('Lỗi!', 'Lỗi kết nối khi tải danh sách người dùng.', 'error');
        }
    }

    // ===== 3. Xử lý tạo người dùng mới =====
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        // Lấy class_name từ <select multiple>
        const selectedOptions = Array.from(document.getElementById('classSelect').selectedOptions);
        payload.class_name = selectedOptions.length > 0
            ? selectedOptions.map(option => option.value)
            : null;

        try {
            const apiUrl = getApiUrl('USERS') + '/';
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers,
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const json = await res.json();
                if (json && json.id) {
                    Swal.fire('Thành công!', 'Tạo người dùng thành công!', 'success');
                    form.reset();
                    document.querySelector('#createUserModal .btn-close').click();
                    loadUsers();
                } else {
                    Swal.fire('Lỗi!', 'Không thể tạo người dùng!', 'error');
                }
            } else {
                const errorData = await res.json().catch(() => ({}));
                const errorMessage = errorData.detail || errorData.response || `HTTP ${res.status}: ${res.statusText}`;
                console.error('Create user error:', errorData);
                Swal.fire('Lỗi!', `Không thể tạo người dùng: ${errorMessage}`, 'error');
            }
        } catch (err) {
            console.error('Network error:', err);
            Swal.fire('Lỗi!', 'Lỗi kết nối. Vui lòng thử lại.', 'error');
        }
    });

    // ===== 4. Tạo mật khẩu ngẫu nhiên =====
    function generatePassword() {
        const random = Math.random().toString(36).slice(-10) + Math.floor(Math.random() * 100);
        document.getElementById('passwordInput').value = random;
    }

    // ===== 5. Copy mật khẩu =====
    function copyPassword() {
        const password = document.getElementById('passwordInput').value;
        if (!password) {
            Swal.fire('Lỗi!', 'Chưa có mật khẩu để sao chép!', 'warning');
            return;
        }

        navigator.clipboard.writeText(password)
            .then(() => Swal.fire('Thành công!', 'Đã sao chép mật khẩu!', 'success'))
            .catch(err => Swal.fire('Lỗi!', 'Không thể sao chép: ' + err, 'error'));
    }

    // ===== 6. Chỉnh sửa người dùng (placeholder) =====
    function editUser(userId) {
        Swal.fire('Thông báo', 'Chức năng chỉnh sửa đang được phát triển!', 'info');
    }

    // ===== 7. Xóa người dùng =====
    async function deleteUser(userId) {
        const result = await Swal.fire({
            title: 'Xác nhận xóa',
            text: 'Bạn có chắc chắn muốn xóa người dùng này?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Xóa',
            cancelButtonText: 'Hủy'
        });

        if (!result.isConfirmed) return;

        try {
            const apiUrl = getApiUrl('USERS') + '/' + userId;
            const res = await fetch(apiUrl, {
                method: 'DELETE',
                headers
            });

            if (res.ok) {
                Swal.fire('Thành công!', 'Đã xóa người dùng!', 'success');
                loadUsers();
            } else {
                const errorData = await res.json().catch(() => ({}));
                const errorMessage = errorData.detail || errorData.response || `HTTP ${res.status}: ${res.statusText}`;
                Swal.fire('Lỗi!', `Không thể xóa người dùng: ${errorMessage}`, 'error');
            }
        } catch (err) {
            console.error('Delete user error:', err);
            Swal.fire('Lỗi!', 'Lỗi kết nối khi xóa người dùng.', 'error');
        }
    }

    // ===== 8. Gắn global các hàm cần thiết =====
    window.generatePassword = generatePassword;
    window.copyPassword = copyPassword;
    window.editUser = editUser;
    window.deleteUser = deleteUser;

    // ===== 9. Khởi tạo: load lớp + user nếu đã login =====
    if (token) {
        loadClassOptions();
        loadUsers();
    }

    async function populateClassSelect(selectElement, selectedValues = []) {
        try {
            const res = await fetch('https://aimarketingvn.com/webhook/list-class');
            const data = await res.json();
            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.mon;
                option.textContent = item.mon;
                if (selectedValues.includes(item.mon)) option.selected = true;
                selectElement.appendChild(option);
            });
        } catch (error) {
            console.error('Lỗi tải danh sách lớp:', error);
        }
    }
    document.addEventListener('click', async function (e) {
        const row = e.target.closest('tr');
        if (e.target.classList.contains('editBtn')) {
            const cells = row.querySelectorAll('.editable');

            // SỬA LỖI: Thay thế forEach bằng vòng lặp for...of
            for (const cell of cells) {
                const field = cell.dataset.field;
                const value = cell.dataset.value || cell.textContent.trim();

                if (field === 'class_name') {
                    cell.innerHTML = `<select class="form-select form-select-sm" multiple required></select>`;
                    const select = cell.querySelector('select');
                    // Bây giờ await sẽ hoạt động chính xác
                    await populateClassSelect(select, JSON.parse(value || '[]'));
                } else if (field === 'gender') {
                    cell.innerHTML = `
                  <select class="form-select form-select-sm">
                    <option value="male" ${value === 'male' ? 'selected' : ''}>Nam</option>
                    <option value="female" ${value === 'female' ? 'selected' : ''}>Nữ</option>
                  </select>`;
                } else if (field === 'role') {
                    cell.innerHTML = `
                  <select class="form-select form-select-sm">
                    <option value="STUDENT" ${value === 'STUDENT' ? 'selected' : ''}>Học sinh</option>
                    <option value="TEACHER" ${value === 'TEACHER' ? 'selected' : ''}>Giáo viên</option>
                    <option value="ADMIN" ${value === 'ADMIN' ? 'selected' : ''}>Quản trị</option>
                  </select>`;
                } else {
                    cell.innerHTML = `<input type="text" class="form-control form-control-sm" value="${value}">`;
                }
            }

            const actions = row.querySelector('.action-buttons');
            actions.innerHTML = `
          <button class="btn btn-sm btn-primary updateBtn">Cập nhật</button>
          <button class="btn btn-sm btn-secondary cancelBtn">Huỷ</button>`;
        }

        if (e.target.classList.contains('cancelBtn')) {
            loadUsers(); // Reload lại danh sách để huỷ thay đổi
        }

        if (e.target.classList.contains('updateBtn')) {
            const id = row.dataset.id;
            const payload = {};

            row.querySelectorAll('.editable').forEach(cell => {
                const field = cell.dataset.field;
                if (field === 'class_name') {
                    const selected = Array.from(cell.querySelector('select').selectedOptions).map(o => o.value);
                    payload[field] = selected;
                } else {
                    const input = cell.querySelector('input, select');
                    payload[field] = input ? input.value : cell.textContent.trim();
                }
            });

            try {
                const res = await fetch(`https://api.aagents.vn/api/v1/users/${id}`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if (json && json.id) {
                    alert('Cập nhật thành công!');
                    loadUsers();
                } else {
                    alert('Cập nhật thất bại!');
                }
            } catch (err) {
                console.error(err);
                alert('Lỗi cập nhật người dùng.');
            }
        }
    });
</script>
