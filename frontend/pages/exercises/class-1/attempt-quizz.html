<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài trắc nghiệm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div id="quizContainer"></div>
    <div class="mt-4">
      <button id="submitBtn" class="btn btn-primary">Nộp bài</button>
    </div>
    <div id="resultContainer" class="mt-5"></div>
  </div>

  <script>
    const quizId = new URLSearchParams(window.location.search).get('id');
    const userId = 'test_user_456'; // Tùy ý xử lý theo auth thực tế
    let quizData = null;

    async function fetchQuiz() {
      try {
        const res = await fetch(`https://api.aagents.vn/api/v1/quiz/${quizId}`);
        const json = await res.json();
        quizData = json.data;
        renderQuiz(quizData);
      } catch (err) {
        document.getElementById('quizContainer').innerHTML = '<div class="alert alert-danger">Không thể tải bài tập.</div>';
      }
    }

    function renderQuiz(quiz) {
      let html = `<h2>${quiz.title}</h2><p>${quiz.description}</p><form id="quizForm">`;
      quiz.questions.forEach((q, index) => {
        html += `
          <div class="card my-3">
            <div class="card-body">
              <h5 class="card-title">Câu ${index + 1}: ${q.question_text}</h5>
              ${q.options.map(option => `
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="${q.question_id}" value="${option}" required>
                  <label class="form-check-label">${option}</label>
                </div>
              `).join('')}
            </div>
          </div>`;
      });
      html += '</form>';
      document.getElementById('quizContainer').innerHTML = html;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const form = document.getElementById('quizForm');
      if (!form.reportValidity()) return;

      const answers = quizData.questions.map(q => {
        const selected = form.querySelector(`input[name="${q.question_id}"]:checked`);
        return {
          question_id: q.question_id,
          answer: selected ? selected.value : ''
        };
      });

      const payload = {
        quiz_id: quizId,
        user_id: userId,
        answers: answers
      };

      try {
        const res = await fetch('https://api.aagents.vn/api/v1/quiz/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        renderResult(result.data);
      } catch (err) {
        alert('Lỗi khi nộp bài');
      }
    });

    function renderResult(data) {
      let html = `<h4>Kết quả</h4>
        <p>Điểm: ${data.earned_points} / ${data.total_points}</p>
        <p>Tỷ lệ đúng: ${data.score_percentage}%</p>
        <hr>`;

      data.results.forEach((r, index) => {
        html += `<div class="mb-3">
          <strong>Câu ${index + 1}:</strong><br>
          Trả lời của bạn: <span class="${r.is_correct ? 'text-success' : 'text-danger'}">${r.user_answer}</span><br>
          Đáp án đúng: ${r.correct_answer}
        </div>`;
      });

      document.getElementById('resultContainer').innerHTML = html;
    }

    fetchQuiz();
  </script>
</body>
</html>
