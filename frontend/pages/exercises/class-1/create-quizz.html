<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Tạo bài tập trắc nghiệm</h1>

    <form id="quizForm">
      <div class="mb-3">
        <label class="form-label">Tiêu đề</label>
        <input type="text" name="title" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3" required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Người tạo</label>
        <input type="text" name="created_by" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Thời gian (giây)</label>
        <input type="number" name="time_limit" class="form-control" required>
      </div>

      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" name="allow_multiple_attempts" id="multipleAttempts">
        <label class="form-check-label" for="multipleAttempts">Cho phép làm lại nhiều lần</label>
      </div>

      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" name="shuffle_questions" id="shuffleQuestions">
        <label class="form-check-label" for="shuffleQuestions">Xáo trộn câu hỏi</label>
      </div>

      <h4 class="mb-3">Danh sách câu hỏi</h4>
      <div id="questionsContainer"></div>
      <button type="button" class="btn btn-secondary my-3" onclick="addQuestion()">Thêm câu hỏi</button>

      <hr>
      <button type="submit" class="btn btn-primary">Tạo bài tập</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      let questionCount = 0;

    function addQuestion() {
      const id = `q${questionCount++}`;
      const container = document.getElementById('questionsContainer');
    
      const html = `
      <div class="card mb-4 question-block" data-id="${id}">
        <div class="card-body">
          <h5 class="card-title">Câu hỏi ${questionCount}</h5>
    
          <div class="mb-3">
            <label class="form-label">Nội dung câu hỏi</label>
            <input type="text" class="form-control" name="question_text_${id}" required>
          </div>
    
          <div class="mb-3">
            <label class="form-label">Loại câu hỏi</label>
            <select class="form-select" name="question_type_${id}" onchange="handleTypeChange('${id}', this.value)">
              <option value="multiple_choice">Trắc nghiệm</option>
              <option value="true_false">Đúng/Sai</option>
              <option value="text">Tự luận</option>
            </select>
          </div>
    
          <div id="options_${id}">
            <div class="mb-2"><input type="text" class="form-control" name="option_0_${id}" placeholder="Đáp án A"></div>
            <div class="mb-2"><input type="text" class="form-control" name="option_1_${id}" placeholder="Đáp án B"></div>
            <div class="mb-2"><input type="text" class="form-control" name="option_2_${id}" placeholder="Đáp án C"></div>
            <div class="mb-2"><input type="text" class="form-control" name="option_3_${id}" placeholder="Đáp án D"></div>
          </div>
    
          <div class="mb-3">
            <label class="form-label">Đáp án đúng</label>
            <input type="text" class="form-control" name="correct_answer_${id}" required>
          </div>
    
          <div class="mb-3">
            <label class="form-label">Số điểm</label>
            <input type="number" class="form-control" name="points_${id}" required>
          </div>
    
          <div class="mb-3">
            <label class="form-label">Giải thích (tuỳ chọn)</label>
            <textarea class="form-control" name="explanation_${id}" rows="2"></textarea>
          </div>
        </div>
      </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    }
    
    function handleTypeChange(id, type) {
      const optionsDiv = document.getElementById(`options_${id}`);
      optionsDiv.style.display = type === 'multiple_choice' ? 'block' : 'none';
    }
    
    document.getElementById('quizForm').addEventListener('submit', function (e) {
      e.preventDefault();
    
      const form = e.target;
      const data = {
        title: form.title.value,
        description: form.description.value,
        created_by: form.created_by.value,
        time_limit: Number(form.time_limit.value),
        allow_multiple_attempts: form.allow_multiple_attempts.checked,
        shuffle_questions: form.shuffle_questions.checked,
        questions: []
      };
    
      const questionBlocks = document.querySelectorAll('.question-block');
      questionBlocks.forEach(block => {
        const id = block.dataset.id;
        const type = form[`question_type_${id}`].value;
        const question = {
          question_text: form[`question_text_${id}`].value,
          question_type: type,
          correct_answer: parseCorrectAnswer(form[`correct_answer_${id}`].value, type),
          points: Number(form[`points_${id}`].value),
          explanation: form[`explanation_${id}`].value
        };
        if (type === 'multiple_choice') {
          question.options = [
            form[`option_0_${id}`].value,
            form[`option_1_${id}`].value,
            form[`option_2_${id}`].value,
            form[`option_3_${id}`].value
          ];
        }
        data.questions.push(question);
      });
    
      console.log('Sending data to backend:', data);
    
      // Gửi về API giả định (bạn đổi URL theo BE thật của bạn)
      fetch('https://api.aagents.vn/api/v1/quiz/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(res => {
          if (res.ok) {
            alert('Tạo bài thành công!');
            window.location.href = '/pages/exercises/class-1/list-quizz.html'; // hoặc /quiz/list nếu dùng route SPA
          } else {
            alert('Lỗi khi tạo bài tập');
          }
        }).catch(err => {
        console.error(err);
        alert('Lỗi kết nối đến máy chủ');
      });
    });
    
    function parseCorrectAnswer(value, type) {
      if (type === 'true_false') return value.toLowerCase() === 'true';
      return value;
    }
  </script>
</body>
</html>
