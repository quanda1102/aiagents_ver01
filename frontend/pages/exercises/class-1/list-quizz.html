<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách bài tập trắc nghiệm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">📚 Danh sách bài tập trắc nghiệm</h2>

    <div id="quizList" class="row g-4">
      <!-- Quiz cards sẽ được thêm vào đây bằng JS -->
    </div>
  </div>

  <script>
      document.addEventListener('DOMContentLoaded', async () => {
      const quizListContainer = document.getElementById('quizList');
    
      try {
        const response = await fetch('https://api.aagents.vn/api/v1/quiz/list');
        const json = await response.json();
        const quizzes = json.quizzes;
    
        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          quizListContainer.innerHTML = `<p>Không có bài tập nào.</p>`;
          return;
        }
    
        quizzes.forEach((quiz) => {
          const card = document.createElement('div');
          card.className = 'col-md-6';
    
          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${quiz.title}</h5>
                <p class="card-text">${quiz.description}</p>
                <ul class="list-group list-group-flush mb-3">
                  <li class="list-group-item"><strong>Người tạo:</strong> ${quiz.created_by}</li>
                  <li class="list-group-item"><strong>Thời gian:</strong> ${quiz.time_limit} giây</li>
                  <li class="list-group-item"><strong>Số câu hỏi:</strong> ${quiz.question_count}</li>
                  <li class="list-group-item"><strong>Tổng điểm:</strong> ${quiz.total_points}</li>
                </ul>
                <a href="/pages/exercises/class-1/attempt-quizz.html?id=${quiz.quiz_id}" class="btn btn-primary btn-sm">Làm bài</a>
                <button type="button" class="btn btn-danger btn-sm ms-2" onclick="deleteQuiz('${quiz.quiz_id}', this)">Xoá</button>
              </div>
            </div>
          `;
          quizListContainer.appendChild(card);
        });
    
      } catch (error) {
        console.error('Lỗi tải danh sách:', error);
        quizListContainer.innerHTML = `<div class="alert alert-danger">Không thể tải danh sách bài tập.</div>`;
      }
    });
    async function deleteQuiz(quizId, btn) {
      if (!confirm('Bạn có chắc chắn muốn xoá bài tập này?')) return;
    
      try {
        const response = await fetch(`https://api.aagents.vn/api/v1/quiz/${quizId}`, {
          method: 'DELETE'
        });
    
        const json = await response.json();
        if (json.success) {
          alert('Đã xoá thành công');
          // Xoá khỏi giao diện
          const card = btn.closest('.col-md-6');
          card.remove();
        } else {
          alert('Không thể xoá bài tập');
        }
      } catch (error) {
        console.error(error);
        alert('Lỗi khi xoá bài tập');
      }
    }
  </script>
</body>
</html>
